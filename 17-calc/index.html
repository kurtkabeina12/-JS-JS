<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		.btn-group {
			margin-top: 10px;
		}

		.btn {
			background-color: #4CAF50;
			/* Green */
			border: none;

			color: white;
			padding: 10px 20px;
			text-align: center;
			border-radius: 10px;
			text-decoration: none;
			display: inline-block;
			font-size: 16px;
		}
	</style>
</head>

<body>
	<input id="firstInput" type="text" placeholder="Введите первое значение....">
	<input id="secondInput" type="text" placeholder="Введите второе значение....">
	<div class="btn-group">
		<button class="btn" type="button">+</button>
		<button class="btn" type="button">-</button>
		<button class="btn" type="button">X</button>
		<button class="btn" type="button">÷</button>
	</div>
	<p id="result"></p>
	<script src="./main.js"></script>
</body>

</html>
